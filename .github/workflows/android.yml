# Tını Android uygulamasını (APK) derler ve "android" sürümüne yükler.
# İndirme: https://github.com/aaskinkk-cloud/musikisinaz/releases/download/android/tini.apk
name: Tını Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Derle
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee derle.log || { grep -E "error:|e: |What went wrong|\.java:[0-9]+" derle.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: APK adını düzelt
        run: cp android/app/build/outputs/apk/release/app-release.apk tini.apk
      - name: APK'yı siteye de koy (aaskinkk-cloud.github.io/musikisinaz/tini.apk)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add -f tini.apk
          git commit -m "APK güncellendi (siteden indirme)" || exit 0
          git push origin HEAD:${{ github.ref_name }} || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Tını Android
          body: "Tını Android uygulaması — kalıcı tam ekran, telefondaki müzikler kendiliğinden listelenir, arka planda / ekran kapalıyken çalar, kilit ekranı ve araç (direksiyon) düğmeleri çalışır. Telefona indir ve aç (bilinmeyen kaynak izni ister)."
          files: tini.apk
          make_latest: true
